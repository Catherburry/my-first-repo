<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Beautiful 🧁</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 600px;
            padding: 40px;
        }
        h1 {
            font-size: 4.5rem;
            margin-bottom: 20px;
            color: #ff6b9d;
        }
        .cupcake {
            font-size: 5rem;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }
        p {
            font-size: 1.4rem;
            line-height: 1.6;
            color: #555;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cupcake">🧁</div>
        <h1>Hello Beautiful!</h1>
        <p>ยินดีต้อนรับสู่หน้าเว็บแรกของฉันบน GitHub Pages</p>
        <p>ฉันกำลังเรียนรู้และทดลองเล่นอยู่ 🧪</p>
        <p><strong>Made with ❤️ by Catherburry</strong></p>
    </div>
</body>
</html>
